# Local MongoDB for MS08 - Audit and analytics.
# Run it from the infra/ folder:  docker compose up -d
services:
  mongo:
    image: mongo:7
    container_name: ms08-audit-mongo
    restart: unless-stopped
    ports:
      # Host port 27018 (not 27017) so it does not clash with other local MongoDB containers.
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - ms08-audit-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ms08-audit-data:
